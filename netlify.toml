# Data delivery moved to the GitHub CDN (jsDelivr) on 2026-11-09.
# Skip Netlify builds for commits that only touch generated data, so the
# 3x-daily data builds and 2x-daily sims commits stop burning build credits.
# Exit 0 = skip the build (nothing outside the excluded paths changed).
# Missing refs (first build / cleared cache) always build.
[build]
  ignore = "if [ -z \"$CACHED_COMMIT_REF\" ] || [ -z \"$COMMIT_REF\" ]; then exit 1; fi; git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ':(exclude)data/*' ':(exclude)sims/*' ':(exclude)data-builder/cache/*'"

# Netlify deploy config for the NHL Goal Model static site.
#
# The NHL API (api-web.nhle.com) does not send CORS headers, so browsers
# refuse direct cross-origin fetch() calls. This rewrite proxies the API
# through the same origin, which the browser happily allows. No functions,
# no build step — plain static hosting + one rewrite rule.

[[redirects]]
  from = "/nhl-api/*"
  to = "https://api-web.nhle.com/v1/:splat"
  status = 200
  force = true

# NHL stats API (season leaderboards — shots etc.) through the same origin:
[[redirects]]
  from = "/nhl-stats/*"
  to = "https://api.nhle.com/stats/rest/en/:splat"
  status = 200
  force = true

# Keep internal docs off the live site:
[[redirects]]
  from = "/MODEL.md"
  to = "/404"
  status = 404

# Long cache for the immutable image CDN is unnecessary (images load
# straight from assets.nhle.com in the browser). Keep HTML fresh:
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=60"
