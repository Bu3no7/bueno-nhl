<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bueno Sports - MLB</title>
<link rel="stylesheet" href="styles.css">
<style>
:root { --teal: #00FF7F; --teal-wash: rgba(0,255,127,.08); }
.hero-num, .pick-fair, .fit-badge { color: #00FF7F !important; }
.hero-num { text-shadow: 0 0 16px rgba(0,255,127,.35); }
.mlb-pick { display: flex; align-items: center; gap: .8rem; padding: .7rem 0; border-bottom: 1px solid rgba(255,255,255,.06); }
.mlb-pick:last-child { border-bottom: none; }
.mlb-hr-pct { font-size: 1.8rem; font-weight: 800; color: #00FF7F; min-width: 70px; text-shadow: 0 0 12px rgba(0,255,127,.3); }
.mlb-hr-pct small { font-size: .9rem; }
.mlb-info { flex: 1; }
.mlb-name { font-weight: 700; }
.mlb-meta { font-size: .78rem; color: var(--muted); }
.mlb-fair { font-size: .78rem; color: var(--gold); }
.mlb-game-head { font-size: .85rem; font-weight: 700; color: var(--muted); margin: 1.2rem 0 .5rem; text-transform: uppercase; letter-spacing: .05em; }
</style>
</head>
<body>
<div style="max-width:480px;margin:0 auto;padding:1rem">
  <div style="text-align:center;margin-bottom:1rem">
    <h2>Bueno Sports</h2>
    <div class="sport-picker">
      <select id="sportSelect" aria-label="Choose sport">
        <option value="nhl">NHL</option>
        <option value="mlb" selected>MLB</option>
        <option value="nfl">NFL</option>
        <option value="nba">NBA</option>
        <option value="ufc">UFC</option>
        <option value="soccer">Soccer</option>
      </select>
    </div>
    <p class="muted small">MLB home run probabilities &middot; live data</p>
  </div>
  <div id="mlbContent"><p class="muted">Loading today's slate…</p></div>
</div>
<script src="mlb-engine.js"></script>
<script>
document.getElementById('sportSelect').addEventListener('change', (e) => {
  const v = e.target.value;
  window.location.href = v === 'nhl' ? 'index.html' : v + '.html';
});
(async function loadMlb() {
  const el = document.getElementById('mlbContent');
  try {
    const today = new Date().toISOString().slice(0, 10);
    const games = await fetchMlbSchedule(today);
    if (!games.length) {
      el.innerHTML = '<p class="muted">No MLB games today.</p>';
      return;
    }
    let html = '';
    for (const g of games) {
      html += `<div class="mlb-game-head">${g.awayAbbr} @ ${g.homeAbbr}</div>`;
      // For v1, show probable pitchers and note lineups need manual refresh
      const awayP = g.awayPitcher ? g.awayPitcher.name : 'TBD';
      const homeP = g.homePitcher ? g.homePitcher.name : 'TBD';
      html += `<p class="muted small">Probables: ${awayP} vs ${homeP}</p>`;
      html += '<p class="muted small">Full hitter pricing coming soon — engine is ready.</p>';
    }
    el.innerHTML = html;
  } catch (e) {
    el.innerHTML = '<p class="muted">Couldn\'t load MLB data.</p>';
  }
})();
</script>
</body>
</html>
