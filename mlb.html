<!DOCTYPE html>
<html lang="en">
<head>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="/icon.svg">
<link rel="apple-touch-icon" href="/apple-touch-icon.png.PNG">
<meta name="theme-color" content="#04070c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Bueno">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bueno Sports - MLB</title>
<link rel="stylesheet" href="styles.css">
<style>
:root { --teal: #00FF7F; --teal-wash: rgba(0,255,127,.08); }
.hero-num { color: #00FF7F !important; text-shadow: 0 0 16px rgba(0,255,127,.35); }
.hero-num small { font-size: 1rem; }
.mlb-hr-pct { font-size: 1.8rem; font-weight: 800; color: #00FF7F; min-width: 70px; }
.bnav-btn.active, .tab.active { color: #00FF7F !important; }
.live-dot { animation: pulse-dot 1.6s ease-in-out infinite; }
</style>
</head>
<body>
<div class="page-topbar">
  <button class="top-btn" type="button" data-sports-menu>☰ <span>Sports</span></button>
  <span class="topbar-label">Baseball</span>
  <span style="width:44px"></span>
</div>
<div id="loadingBar" class="loading hidden"><span id="loadingText">Loading…</span></div>

<section id="view-home" class="view active">
  <div class="home-hero">
    <a class="bueno-logo center" href="index.html" aria-label="Bueno Sports home"><svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><polyline points="20,200 70,168 110,178 150,118 190,88 220,52" fill="none" stroke="#1E9E54" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/><circle cx="220" cy="52" r="13" fill="#4ADE80"/></svg><span class="word">Bueno•Sports</span></a>
    <p class="muted small">MLB home run probabilities &middot; live data</p>
  </div>
  <div class="home-grid">
    <div class="home-card" id="mlbPicksCard">
      <h3>Top HR picks</h3>
      <div id="mlbPicksBody"><p class="muted">Loading…</p></div>
    </div>
    <div class="home-card" id="mlbStandingsCard">
      <h3>Standings</h3>
      <div id="mlbStandingsBody"><p class="muted">Loading…</p></div>
    </div>
  </div>
</section>

<section id="view-lab" class="view">
  <div class="tabs" role="tablist">
    <button class="tab active" data-view="board" role="tab">Board</button>
    <button class="tab" data-view="longshots" role="tab">Longshots</button>
    <button class="tab" data-view="slate" role="tab">Slate</button>
  </div>
  <section id="mlb-view-board" class="view active">
    <div class="view-head"><div><p class="kicker">Model</p><h2>HR Board</h2></div></div>
    <div class="table-wrap"><table id="mlbBoardTable">
      <thead><tr><th>Hitter</th><th>Team</th><th class="num">HR Prob</th><th class="num">Fair</th></tr></thead>
      <tbody id="mlbBoardBody"></tbody>
    </table></div>
  </section>
  <section id="mlb-view-longshots" class="view">
    <div class="view-head"><div><p class="kicker">Value</p><h2>Longshots</h2></div></div>
    <div id="mlbLongshotsBody"><p class="muted">Loading…</p></div>
  </section>
  <section id="mlb-view-slate" class="view">
    <div class="view-head"><div><p class="kicker">Games</p><h2>Slate</h2></div></div>
    <div id="mlbSlateBody"><p class="muted">Loading…</p></div>
  </section>
</section>

<nav class="bottom-nav" aria-label="Main">
  <button class="bnav-btn active" data-bnav="home"><span class="bnav-ico">⚾</span><span>MLB</span></button>
  <button class="bnav-btn" data-bnav="lab"><span class="bnav-ico">🧢</span><span>The Dugout</span></button>
</nav>

<script src="mlb-engine.js"></script>
<script>
// Bottom nav
document.querySelectorAll('[data-bnav]').forEach(b => b.addEventListener('click', () => {
  document.querySelectorAll('[data-bnav]').forEach(x => x.classList.remove('active'));
  b.classList.add('active');
  document.getElementById('view-home').classList.toggle('active', b.dataset.bnav === 'home');
  document.getElementById('view-lab').classList.toggle('active', b.dataset.bnav === 'lab');
}));
// Dugout tabs
document.querySelectorAll('#view-lab .tab').forEach(t => t.addEventListener('click', () => {
  document.querySelectorAll('#view-lab .tab').forEach(x => x.classList.remove('active'));
  t.classList.add('active');
  ['board','longshots','slate'].forEach(v => {
    document.getElementById('mlb-view-'+v).classList.toggle('active', v === t.dataset.view);
  });
}));
// Load MLB data
(async function() {
  const $ = (id) => document.getElementById(id);
  const picksEl = $('mlbPicksBody'), boardBody = $('mlbBoardBody'),
        longBody = $('mlbLongshotsBody'), slateBody = $('mlbSlateBody'),
        standEl = $('mlbStandingsBody');
  const empty = (el, msg) => { if (el) el.innerHTML = '<p class="muted">' + msg + '</p>'; };
  // Team logos (ESPN CDN slug map)
  const MLB_LOGO_SLUG = { ARI:'ari', ATL:'atl', BAL:'bal', BOS:'bos', CHC:'chc', CWS:'chw', CIN:'cin', CLE:'cle', COL:'col', DET:'det', HOU:'hou', KC:'kc', LAA:'laa', LAD:'lad', MIA:'mia', MIL:'mil', MIN:'min', NYY:'nyy', NYM:'nym', OAK:'ath', ATH:'ath', PHI:'phi', PIT:'pit', SD:'sd', SF:'sf', SEA:'sea', STL:'stl', TB:'tb', TEX:'tex', TOR:'tor', WSH:'wsh' };
  const mlbLogo = (abbr) => { const s = MLB_LOGO_SLUG[String(abbr || '').toUpperCase()]; return s ? 'https://a.espncdn.com/i/teamlogos/mlb/500/' + s + '.png' : ''; };
  const logoImg = (abbr, px) => mlbLogo(abbr)
    ? '<img src="' + mlbLogo(abbr) + '" alt="' + abbr + '" width="' + px + '" height="' + px + '" style="vertical-align:-4px">'
    : abbr;
  try {
    // Local date, not UTC — a 6pm Phoenix game is "today" here, tomorrow in UTC
    const now = new Date(), p2 = (n) => String(n).padStart(2, '0');
    const today = now.getFullYear() + '-' + p2(now.getMonth() + 1) + '-' + p2(now.getDate());
    const games = await fetchMlbSchedule(today);
    if (!games.length) {
      empty(picksEl, 'No MLB games today.');
      empty(standEl, 'Offseason.');
      if (boardBody) boardBody.innerHTML = '';
      empty(longBody, 'No games today.');
      empty(slateBody, 'No MLB games today.');
      return;
    }
    empty(standEl, 'Postseason — standings are final.');
    const cache = new Map();
    const getHitter = (id) => { const k = 'h' + id; if (!cache.has(k)) cache.set(k, fetchHitterStats(id)); return cache.get(k); };
    const getPitcher = (id) => { const k = 'p' + id; if (!cache.has(k)) cache.set(k, fetchPitcherStats(id)); return cache.get(k); };
    const rows = [], heads = [];
    for (const g of games) {
      const ab = g.away.abbr, hb = g.home.abbr;
      const ap = g.away.probablePitcher, hp = g.home.probablePitcher;
      heads.push(
        '<div class="mlb-game-head">' + logoImg(ab, 22) + ' ' + ab + ' @ ' + hb + ' ' + logoImg(hb, 22) + '</div>' +
        '<p class="muted small">Probables: ' + (ap ? ap.name : 'TBD') + ' vs ' + (hp ? hp.name : 'TBD') + '</p>'
      );
      for (const pair of [[g.away, g.home], [g.home, g.away]]) {
        const team = pair[0], opp = pair[1];
        if (!team.id) continue;
        const roster = await fetchMlbRoster(team.id);
        const bats = roster.filter((pl) => pl.pos !== 'P');
        const oppPS = opp.probablePitcher ? await getPitcher(opp.probablePitcher.id) : null;
        const priced = await Promise.all(bats.map(async (h) => {
          const hs = await getHitter(h.id);
          if (!hs || !(hs.pa > 0)) return null;
          const r = priceHitter(hs, oppPS, 1.0, null); // neutral park, neutral lineup spot
          return { name: h.name, team: team.abbr, pos: h.pos, pa: hs.pa, hr: hs.hr, p: r.p, fair: r.fair };
        }));
        for (const r of priced) if (r) rows.push(r);
      }
    }
    rows.sort((a, b) => b.p - a.p);
    const pct = (p) => (p * 100).toFixed(1) + '%';
    const tr = (r) =>
      '<tr><td>' + r.name + ' <span class="muted small">' + r.pos + ' · ' + r.hr + ' HR</span></td>' +
      '<td>' + logoImg(r.team, 20) + ' ' + r.team + '</td>' +
      '<td class="num mlb-hr-pct">' + pct(r.p) + '</td><td class="num">' + r.fair + '</td></tr>';
    picksEl.innerHTML = heads.join('') +
      '<p class="kicker" style="margin:12px 0 4px">Top HR picks</p>' +
      '<div class="table-wrap"><table><tbody>' + rows.slice(0, 5).map(tr).join('') + '</tbody></table></div>';
    boardBody.innerHTML = rows.map(tr).join('');
    const longs = rows.filter((r) => /^\+\d+$/.test(r.fair) && parseInt(r.fair.slice(1), 10) >= 1000).slice(0, 5);
    longBody.innerHTML = longs.length
      ? '<div class="table-wrap"><table><tbody>' + longs.map(tr).join('') + '</tbody></table></div>'
      : '<p class="muted">No +1000 or longer shots today.</p>';
    slateBody.innerHTML = heads.join('');
  } catch (e) { empty(picksEl, "Couldn't load."); }
})();
</script>
<script src="sports-menu.js"></script>
<script>
/* ---- Score ticker: top row of the bottom nav (Baseball has no Tonight
   board to replace — the ticker is an addition). Scores + slate from the
   MLB Stats API, leaders from the same API. Off-season it shows leaders
   only; with no data at all it hides. ---- */
(function () {
  var API = 'https://statsapi.mlb.com/api/v1';
  var stk = { games: [], tomorrow: null, leaders: null, lastHtml: '' };
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function logo(id, cls) { return '<img class="stk-logo ' + (cls || '') + '" src="https://www.mlbstatic.com/team-logos/' + id + '.svg" alt="" onerror="this.style.display=\'none\'">'; }
  function last(name) { return String(name || '').split(' ').pop(); }
  function getJ(u) { return fetch(u).then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); }); }
  function fmtDate(d) { return (d.getMonth() + 1) + '/' + d.getDate() + '/' + d.getFullYear(); }
  function parseGames(d) {
    var dates = (d && d.dates) || [];
    var games = (dates[0] && dates[0].games) || [];
    return games.map(function (g) {
      var st = g.status || {};
      var ls = g.linescore || {};
      return {
        state: st.abstractGameState || 'Preview',
        detail: st.detailedState || '',
        start: g.gameDate,
        away: { id: (g.teams.away.team || {}).id, name: (g.teams.away.team || {}).name || '', score: g.teams.away.score },
        home: { id: (g.teams.home.team || {}).id, name: (g.teams.home.team || {}).name || '', score: g.teams.home.score },
        inning: ls.currentInningOrdinal ? ((ls.inningState || '') + ' ' + ls.currentInningOrdinal) : '',
        innings: (ls.innings || []).length,
      };
    });
  }
  function chip(g) {
    var played = g.state !== 'Preview';
    var logos = logo(g.away.id) + '<span class="stk-sc">' + (played && g.away.score != null ? g.away.score : '') + '</span><span class="stk-vs">@</span>' +
      logo(g.home.id) + '<span class="stk-sc">' + (played && g.home.score != null ? g.home.score : '') + '</span>';
    if (g.state === 'Live') return '<span class="stk-chip"><span class="stk-dot"></span>' + logos + '<span class="stk-clock">' + esc(g.inning || g.detail) + '</span></span>';
    if (g.state === 'Final') return '<span class="stk-chip">' + logos + '<span class="stk-st">Final' + (g.innings > 9 ? ' · ' + g.innings : '') + '</span></span>';
    var t = new Date(g.start).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
    return '<span class="stk-chip">' + logo(g.away.id) + '<span class="stk-vs">@</span>' + logo(g.home.id) + '<span class="stk-time">' + esc(t) + '</span></span>';
  }
  function news() {
    var out = [];
    stk.games.forEach(function (g) {
      if (g.state !== 'Final' || g.away.score == null || g.home.score == null) return;
      var w = g.away.score > g.home.score ? g.away : g.home;
      var l = g.away.score > g.home.score ? g.home : g.away;
      var ws = Math.max(g.away.score, g.home.score), ls = Math.min(g.away.score, g.home.score);
      if (ls === 0) out.push('<b>' + esc(w.name) + '</b> blank ' + esc(l.name) + ' ' + ws + '\u20130');
      else if (g.innings > 9) out.push('<b>' + esc(w.name) + '</b> edge ' + esc(l.name) + ' ' + ws + '\u2013' + ls + ' in ' + g.innings + ' innings');
      else if (ws - ls >= 6) out.push('<b>' + esc(w.name) + '</b> rout ' + esc(l.name) + ' ' + ws + '\u2013' + ls);
    });
    return out.slice(0, 4);
  }
  function buildHtml() {
    var h = '';
    var live = stk.games.filter(function (g) { return g.state === 'Live'; });
    var fin = stk.games.filter(function (g) { return g.state === 'Final'; });
    var pre = stk.games.filter(function (g) { return g.state === 'Preview'; });
    var ordered = live.concat(fin, pre);
    if (ordered.length) h += '<span class="stk-seg">Scores</span>' + ordered.map(chip).join('');
    if (stk.tomorrow && stk.tomorrow.length) {
      h += '<span class="stk-seg">Tomorrow</span>' + stk.tomorrow.map(chip).join('');
    }
    if (stk.leaders && stk.leaders.length) {
      h += '<span class="stk-seg">Leaders</span>' + stk.leaders.map(function (p) {
        return '<span class="stk-chip">' + logo(p.teamId, 'sm') + '<span class="stk-who">' + esc(last(p.name)) + '</span><span class="stk-stat">' + esc(p.value) + ' ' + p.unit + '</span></span>';
      }).join('');
    }
    var n = news();
    if (n.length) h += '<span class="stk-seg news">News</span>' + n.map(function (x) { return '<span class="stk-chip stk-headline">' + x + '</span>'; }).join('');
    return h;
  }
  function render() {
    var nav = document.querySelector('.bottom-nav');
    if (!nav) return;
    var tk = document.getElementById('stkTicker');
    if (!tk) {
      tk = document.createElement('div');
      tk.className = 'stk-ticker';
      tk.id = 'stkTicker';
      nav.insertBefore(tk, nav.firstChild);
      tk.addEventListener('touchstart', function () {
        tk.classList.add('stk-paused');
        setTimeout(function () { tk.classList.remove('stk-paused'); }, 4000);
      }, { passive: true });
      document.body.style.paddingBottom = (parseFloat(getComputedStyle(document.body).paddingBottom || 0) + 38) + 'px';
    }
    var half0 = buildHtml();
    if (!half0) { tk.style.display = 'none'; return; }
    tk.style.display = '';
    if (half0 === stk.lastHtml) return;
    stk.lastHtml = half0;
    tk.innerHTML = '<div class="stk-track">' + half0 + '</div>';
    var track = tk.firstElementChild;
    var reps = 1;
    while (track.scrollWidth < window.innerWidth * 2 && reps < 6) { track.innerHTML += half0; reps++; }
    var half = track.innerHTML;
    track.innerHTML = half + half;
    var w = track.scrollWidth / 2;
    track.style.animationDuration = Math.max(18, Math.round(w / 55)) + 's';
  }
  function loadScores() {
    var today = new Date();
    getJ(API + '/schedule?sportId=1&hydrate=linescore&date=' + fmtDate(today)).then(function (d) {
      stk.games = parseGames(d);
      render();
    }).catch(function () {});
    var tmr = new Date(Date.now() + 864e5);
    getJ(API + '/schedule?sportId=1&date=' + fmtDate(tmr)).then(function (d) {
      stk.tomorrow = parseGames(d);
      render();
    }).catch(function () { stk.tomorrow = []; });
  }
  function loadLeaders() {
    var now = new Date();
    var season = now.getMonth() >= 2 ? now.getFullYear() : now.getFullYear() - 1;
    getJ(API + '/stats/leaders?leaderCategories=homeRuns,battingAverage,runsBattedIn&season=' + season + '&statGroup=hitting&limit=1').then(function (d) {
      var units = { homeRuns: 'HR', battingAverage: 'AVG', runsBattedIn: 'RBI' };
      var out = [];
      (d.leagueLeaders || []).forEach(function (cat) {
        var L = (cat.leaders || [])[0];
        if (!L) return;
        out.push({ name: (L.person || {}).fullName || '', value: L.value, unit: units[cat.leaderCategory] || '', teamId: (L.team || {}).id });
      });
      stk.leaders = out;
      render();
    }).catch(function () { stk.leaders = []; });
  }
  render();
  loadScores();
  loadLeaders();
  setInterval(loadScores, 60000);
})();
</script>
</body>
</html>
