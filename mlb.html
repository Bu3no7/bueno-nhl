<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bueno Sports - MLB</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div style="max-width:480px;margin:0 auto;padding:2rem 1rem;text-align:center">
  <h2>Bueno Sports</h2>
  <div class="sport-picker">
    <select id="sportSelect" aria-label="Choose sport">
      <option value="nhl">NHL</option>
      <option value="mlb" selected>MLB</option>
      <option value="nfl">NFL</option>
      <option value="nba">NBA</option>
      <option value="ufc">UFC</option>
      <option value="soccer">Soccer</option>
    </select>
  </div>
  <p class="muted" style="margin-top:2rem">MLB coming soon.</p>
  <p><a href="index.html" style="color:var(--teal)">← Back to NHL</a></p>
</div>
<script>
document.getElementById('sportSelect').addEventListener('change', (e) => {
  const v = e.target.value;
  window.location.href = v === 'nhl' ? 'index.html' : v + '.html';
});
</script>
</body>
</html>
